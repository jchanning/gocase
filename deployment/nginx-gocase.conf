# nginx virtual host for GoCaSE
# Location on server: /etc/nginx/conf.d/gocase.conf
#
# NOTE: The SSL certificate block is written here but the certificate files
# will not exist until you run certbot (see setup-server.sh).
# Run setup-server.sh BEFORE copying this file, or let setup-server.sh
# install it automatically.

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gocase.fistraltech.com;
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS reverse proxy → GoCaSE on 127.0.0.1:8081
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gocase.fistraltech.com;

    ssl_certificate     /etc/letsencrypt/live/gocase.fistraltech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gocase.fistraltech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow large uploads for PDF/PPTX notes documents (20 MB)
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for HTMX server-sent events / long-poll
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
