services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: gocase-db
    environment:
      POSTGRES_DB: gocase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GoCaSE Application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: gocase-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/gocase?sslmode=disable
      # OCI Generative AI (optional — set to enable "Generate from Notes")
      # OCI_TENANCY_OCID: ocid1.tenancy.oc1..example
      # OCI_USER_OCID: ocid1.user.oc1..example
      # OCI_FINGERPRINT: aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99
      # OCI_PRIVATE_KEY_PATH: /app/oci_api_key.pem
      # OCI_REGION: uk-london-1
      # OCI_COMPARTMENT_ID: ocid1.compartment.oc1..example
      # OCI_GENAI_MODEL_ID: cohere.command-r-plus
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
