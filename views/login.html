{{define "content"}}
<div class="max-w-md mx-auto mt-10">
    <div class="app-card p-8">
        <h2 class="page-title text-2xl mb-6 text-center">Login</h2>
        
        {{if .Error}}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{.Error}}
        </div>
        {{end}}
        
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="identifier" class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                <input type="text" id="identifier" name="identifier" required autocomplete="username"
                       class="app-input" placeholder="Enter your username or email">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="app-input">
            </div>
            
            <button type="submit" 
                    class="w-full btn btn-primary">
                Login
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 hover:text-blue-800 font-medium">Register here</a>
        </p>
    </div>
</div>
{{end}}
