{{define "content"}}
<div class="container mx-auto px-4 py-8 max-w-xl">
    <a href="/revision" class="text-sm text-blue-600 hover:underline">&larr; Back to Revision Planner</a>
    <h1 class="page-title text-3xl mt-4 mb-1">Create Revision Plan</h1>
    <p class="text-gray-500 mb-6">{{.Syllabus.Title}}</p>

    <div class="app-card p-6 mb-4">
        <div class="flex justify-between text-sm text-gray-500 mb-6">
            <span>{{.TopicCount}} topics</span>
            <span>~{{printf "%.1f" .TotalHours}} hours total</span>
        </div>

        <form method="POST" action="/revision/plan">
            <input type="hidden" name="syllabus_id" value="{{.Syllabus.ID}}">

            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1">Exam Date *</label>
                <input type="date" name="exam_date" required min="{{.MinExamDate}}" class="app-input">
                <p class="text-xs text-gray-400 mt-1">Must be at least 2 days from today.</p>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1">Study hours per day *</label>
                <input type="number" name="hours_per_day" step="0.5" min="0.5" max="12" value="2" required class="app-input">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Study days *</label>
                <div class="flex flex-wrap gap-3">
                    {{range .StudyDayOptions}}
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" name="study_days" value="{{.Index}}"
                               {{if .Default}}checked{{end}}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="text-sm">{{.Name}}</span>
                    </label>
                    {{end}}
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full">Generate Plan</button>
        </form>
    </div>
</div>
{{end}}
